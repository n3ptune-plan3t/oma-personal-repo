name: Build OpenMandriva Packages

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'packages/**'
  pull_request:
    paths:
      - 'packages/**'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find-pkgs.outputs.packages }}
      has_packages: ${{ steps.find-pkgs.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4

      - id: find-pkgs
        run: |
          mkdir -p packages

          # Locate subfolders containing .spec files
          PKGS=$(find packages -mindepth 2 -maxdepth 2 -name "*.spec" -exec dirname {} \; | xargs -r -n 1 basename | sort -u | jq -R -s -c 'split("\n")[:-1]')

          echo "Discovered packages: ${PKGS}"

          if [ -z "$PKGS" ] || [ "$PKGS" = "[]" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo 'packages=["none"]' >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "packages=${PKGS}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    container:
      image: docker.io/openmandriva/cooker
    steps:
      - name: Install Base Packaging Tooling
        run: |
          dnf --refresh -y install \
            rpm-build \
            rpm-openmandriva-setup \
            rpmdevtools \
            dnf-plugins-core \
            git \
            curl \
            tar \
            findutils \
            coreutils

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Sources & Build Dependencies
        run: |
          SPEC_DIR="packages/${{ matrix.package }}"
          SPEC_FILE=$(find "$SPEC_DIR" -maxdepth 1 -name "*.spec" | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo "No .spec file located in $SPEC_DIR"
            exit 1
          fi

          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          # Copy local sources/patches into SOURCES directory
          cp -r "$SPEC_DIR"/* ~/rpmbuild/SOURCES/
          cp "$SPEC_FILE" ~/rpmbuild/SPECS/

          SPEC_BASENAME=$(basename "$SPEC_FILE")

          # Download remote Source URLs defined in the spec
          spectool -g -R ~/rpmbuild/SPECS/"$SPEC_BASENAME"

          # Install spec-declared dependencies
          dnf builddep -y ~/rpmbuild/SPECS/"$SPEC_BASENAME"

      - name: Build RPMs
        run: |
          SPEC_FILE=$(find ~/rpmbuild/SPECS/ -name "*.spec" | head -n 1)
          rpmbuild -ba "$SPEC_FILE"

          mkdir -p dist/
          find ~/rpmbuild/RPMS/ -type f -name "*.rpm" -exec cp {} dist/ \;

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}
          path: dist/*.rpm

  release:
    needs: [discover, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.discover.outputs.has_packages == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-rpms/
          merge-multiple: true

      - name: Publish RPMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-rpms/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
