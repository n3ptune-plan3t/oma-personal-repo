name: Build OpenMandriva package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (must match specs/<name>/<name>.spec)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: openmandriva/minimal:rolling
      options: --platform linux/amd64 --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute cache week
        id: cachekey
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dnf package downloads
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: dnf-pkgcache-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            dnf-pkgcache-

      - name: Build package
        run: sh build.sh
        env:
          PKG: ${{ inputs.package }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Delete previous release for this package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.package }}" \
            --yes \
            --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - name: Publish per-package release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ inputs.package }}
          files: out/*.rpm

      - name: Remove stale versions from the rolling repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in merged/*.rpm; do
            base=$(basename "$f")
            pkg=$(echo "$base" | sed -E 's/-[^-]+-[^-]+\.[a-zA-Z0-9_]+\.rpm$//')

            gh release view repo-rpm \
              --json assets \
              --jq '.assets[].name' \
              2>/dev/null \
              | grep "^${pkg}-" \
              | xargs -r -I{} gh release delete-asset \
                  repo-rpm "{}" --yes || true
          done

      - name: Publish rolling repo release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: repo-rpm
          name: "Personal repo snapshot (RPM)"
          files: |
            merged/*.rpm
            merged/repodata/*

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ inputs.package }}
          path: out/
          if-no-files-found: error
